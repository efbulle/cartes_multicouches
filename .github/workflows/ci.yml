name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Type check
        run: uv run pyright

      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check --output-format=github .

      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Install Chromium for smoke tests
        if: ${{ !cancelled() }}
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        if: ${{ !cancelled() }}
        env:
          CARTES_MULTICOUCHES_TILE_PROVIDER_API_KEY: ${{ secrets.CARTES_MULTICOUCHES_TILE_PROVIDER_API_KEY }}
        run: uv run pytest -ra --cov=cartes_multicouches --cov=cartes_builder --cov-report=term-missing

      - name: Build packages
        run: uv build --all-packages
