version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "efbulle"
    schedule:
      interval: "weekly"
    groups:
      all-github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/"
    assignees:
      - "efbulle"
    schedule:
      interval: "weekly"
    groups:
      all-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Hooks pre-commit (.pre-commit-config.yaml)
  - package-ecosystem: "pre-commit"
    directory: "/"
    assignees:
      - "efbulle"
    schedule:
      interval: "weekly"
    groups:
      all-pre-commit-hooks:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(pre-commit)"
